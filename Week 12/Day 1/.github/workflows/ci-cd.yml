name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feat/aiml-12W-Shreya
  pull_request:
    branches:
      - main
      - feat/aiml-12W-Shreya

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Week 12/Day 1/requirements.txt"

      - name: Run Ruff
        run: |
          ruff check "Week 12/Day 1"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Week 12/Day 1/requirements.txt"

      - name: Run tests
        run: |
          cd "Week 12/Day 1"
          pytest -v test_ml_api.py

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t mlops-ml-api:latest \
            "Week 12/Day 1"

  push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: "Week 12/Day 1"
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-ml-api:latest