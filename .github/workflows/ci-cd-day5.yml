@'
name: Day 5 - Production AI System CI/CD

on:
  push:
    branches:
      - main
      - feat/aiml-12W-Shreya
  pull_request:
    branches:
      - main
      - feat/aiml-12W-Shreya

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r "Week 12/Day 5/requirements.txt"

      - name: Run Ruff
        run: ruff check "Week 12/Day 5"

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r "Week 12/Day 5/requirements.txt"

      - name: Run tests
        working-directory: "Week 12/Day 5"
        run: pytest -v test_app.py

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t 3m-production-ai:latest "Week 12/Day 5"

  push:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: "Week 12/Day 5"
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/3m-production-ai:latest
'@ | Set-Content -Encoding utf8 ".\.github\workflows\ci-cd-day5.yml"