name: Production RAG CI/CD

on:
  push:
    branches:
      - main
      - feat/aiml-12W-Shreya

  pull_request:
    branches:
      - main

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Week 8/Day 1/requirements.txt"
          pip install pytest ruff

      - name: Lint
        run: |
          ruff check "Week 8/Day 1"

      - name: Run tests
        run: |
          pytest -v "Week 8/Day 1/test_api.py"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t production-rag-api:latest "Week 8/Day 1"
